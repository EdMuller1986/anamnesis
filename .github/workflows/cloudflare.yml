name: Deploy to Cloudflare

on:
  push:
    branches:
      - master  # Changed from 'main' to match your branch name
  workflow_dispatch:  # Allow manual triggering from GitHub UI
    inputs:
      deploy_backend:
        description: 'Deploy backend (Workers)'
        required: false
        default: 'true'
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend (Pages)'
        required: false
        default: 'true'
        type: boolean
      # auto_restore removed (P0): restore endpoint is disabled until rewritten safely

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Presence of All Required Secrets
        run: |
          MISSING=0
          check_presence() {
            if [ -z "${1}" ]; then
              echo "::error::Secret ${2} is missing!"
              MISSING=1
            else
              echo "✅ Secret ${2} is present"
            fi
          }
          check_presence "${{ secrets.CLOUDFLARE_API_TOKEN }}" "CLOUDFLARE_API_TOKEN"
          check_presence "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" "CLOUDFLARE_ACCOUNT_ID"
          check_presence "${{ secrets.D1_DATABASE_ID }}" "D1_DATABASE_ID"
          check_presence "${{ secrets.B2_ENDPOINT }}" "B2_ENDPOINT"
          check_presence "${{ secrets.B2_BUCKET_NAME }}" "B2_BUCKET_NAME"
          check_presence "${{ secrets.B2_KEY_ID }}" "B2_KEY_ID"
          check_presence "${{ secrets.B2_APPLICATION_KEY }}" "B2_APPLICATION_KEY"
          check_presence "${{ secrets.VITE_API_URL }}" "VITE_API_URL"
          check_presence "${{ secrets.CORS_ORIGINS }}" "CORS_ORIGINS"
          check_presence "${{ secrets.ADMIN_TOKEN }}" "ADMIN_TOKEN"
          check_presence "${{ secrets.BACKUP_ENCRYPTION_KEY }}" "BACKUP_ENCRYPTION_KEY"
          check_presence "${{ secrets.TELEGRAM_BOT_TOKEN }}" "TELEGRAM_BOT_TOKEN"
          check_presence "${{ secrets.TELEGRAM_CHAT_ID }}" "TELEGRAM_CHAT_ID"

          if [ $MISSING -eq 1 ]; then
            exit 1
          fi

      - name: Functional Check - Cloudflare & D1
        run: |
          echo "Verifying Cloudflare Token and Account..."
          if ! npx wrangler@4 whoami; then
            echo "::error::Cloudflare Token or Account ID is invalid."
            exit 1
          fi

          echo "Checking D1 Database Access..."
          DB_INFO=$(npx wrangler@4 d1 list --json)
          if [ $? -ne 0 ]; then
            echo "::error::Failed to list D1 databases."
            echo "$DB_INFO"
            exit 1
          fi

          if ! echo "$DB_INFO" | grep -q "${{ secrets.D1_DATABASE_ID }}"; then
            echo "::error::D1_DATABASE_ID (${{ secrets.D1_DATABASE_ID }}) not found in your Cloudflare account."
            echo "Available databases:"
            echo "$DB_INFO" | jq -r '.[] | "- \(.name) (\(.uuid))"' || echo "$DB_INFO"
            exit 1
          fi
          
          echo "✅ Cloudflare & D1 Connectivity OK"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Functional Check - Backblaze B2
        run: |
          echo "Testing Backblaze B2 Credentials..."
          # Используем нативный API для проверки ключей (самый надежный способ)
          AUTH_CHECK=$(curl -s -u "${{ secrets.B2_KEY_ID }}:${{ secrets.B2_APPLICATION_KEY }}" \
            https://api.backblazeb2.com/b2api/v3/b2_authorize_account)
          
          if echo "$AUTH_CHECK" | grep -q "authorizationToken"; then
            echo "✅ Backblaze B2 Credentials OK"
          else
            echo "::error::Backblaze B2 Auth Failed. Please check B2_KEY_ID and B2_APPLICATION_KEY."
            echo "Response: $AUTH_CHECK"
            exit 1
          fi

      - name: Functional Check - Telegram
        run: |
          echo "Testing Telegram Bot Token..."
          TG_CHECK=$(curl -s https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getMe)
          if echo "$TG_CHECK" | grep -q '"ok":true'; then
            echo "✅ Telegram Bot Credentials OK"
          else
            echo "::error::Telegram Bot Token Validation Failed."
            echo "Response: $TG_CHECK"
            exit 1
          fi

      - name: Functional Check - Backup Encryption
        run: |
          echo "Testing Encryption logic with provided key..."
          node backend/src/services/verify-encryption.js
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: validate-secrets
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_backend == 'true') }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Use Node 22 LTS (20 is deprecated)
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Create wrangler.toml from secrets
        run: |
          cd backend
          RP_ID="${{ secrets.WEBAUTHN_RP_ID }}"
          RP_ORIGIN="${{ secrets.WEBAUTHN_ORIGIN }}"
          # Fallback only if secrets not set yet (passkeys need real domain in production)
          if [ -z "$RP_ID" ]; then RP_ID="localhost"; echo "::warning::WEBAUTHN_RP_ID secret empty — using localhost"; fi
          if [ -z "$RP_ORIGIN" ]; then RP_ORIGIN="http://localhost:5173"; echo "::warning::WEBAUTHN_ORIGIN secret empty — using localhost"; fi
          cat > wrangler.toml << EOF
          name = "anamnesis-backend"
          main = "src/index.js"
          compatibility_date = "2024-05-02"
          compatibility_flags = ["nodejs_compat"]

          [[d1_databases]]
          binding = "DB"
          database_name = "anamnesis-db"
          database_id = "${{ secrets.D1_DATABASE_ID }}"

          # Non-secret config only. Sensitive values must be Worker Secrets (see next step).
          [vars]
          CORS_ORIGINS = "${{ secrets.CORS_ORIGINS }}"
          B2_ENDPOINT = "${{ secrets.B2_ENDPOINT }}"
          B2_BUCKET_NAME = "${{ secrets.B2_BUCKET_NAME }}"
          B2_KEY_ID = "${{ secrets.B2_KEY_ID }}"
          WEBAUTHN_RP_ID = "${RP_ID}"
          WEBAUTHN_ORIGIN = "${RP_ORIGIN}"
          WEBAUTHN_RP_NAME = "Anamnesis"

          [triggers]
          crons = ["0 2 * * *", "*/15 * * * *"]
          EOF

      - name: Run Backend Tests
        run: cd backend && npm test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Apply D1 migrations (remote)
        run: npx wrangler@4 d1 migrations apply anamnesis-db --remote
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler@4 deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker Secrets (not plaintext [vars]). Persist across deploys; re-push keeps them in sync with GitHub secrets.
      - name: Sync Worker Secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing value for Worker secret $name"
              exit 1
            fi
            printf '%s' "$value" | npx wrangler@4 secret put "$name"
            echo "✅ Secret $name synced"
          }
          put_secret "B2_APPLICATION_KEY" "${{ secrets.B2_APPLICATION_KEY }}"
          put_secret "ADMIN_TOKEN" "${{ secrets.ADMIN_TOKEN }}"
          put_secret "BACKUP_ENCRYPTION_KEY" "${{ secrets.BACKUP_ENCRYPTION_KEY }}"
          put_secret "TELEGRAM_BOT_TOKEN" "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          put_secret "TELEGRAM_CHAT_ID" "${{ secrets.TELEGRAM_CHAT_ID }}"
          # Optional: only sync APP_PIN if the GitHub secret is configured
          if [ -n "${{ secrets.APP_PIN }}" ]; then
            put_secret "APP_PIN" "${{ secrets.APP_PIN }}"
          else
            echo "ℹ️ APP_PIN GitHub secret not set — skip (login needs existing pin_hash or secret)"
          fi

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Use Node 22 LTS (20 is deprecated)
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: |
          cd frontend
          npm run build
          # Generate _redirects from VITE_API_URL (avoid hardcoding another user's Worker)
          # VITE_API_URL is like https://anamnesis-backend.xxx.workers.dev/api
          API="${{ secrets.VITE_API_URL }}"
          API="${API%/}"
          # strip trailing /api for Pages proxy target base
          ORIGIN="${API%/api}"
          if [ -n "$ORIGIN" ]; then
            echo "/api/* ${ORIGIN}/api/:splat 200" > dist/_redirects
            echo "Generated _redirects -> ${ORIGIN}/api/:splat"
          else
            cp public/_redirects dist/_redirects || true
          fi
          if [ ! -f dist/_headers ]; then
            cp public/_headers dist/_headers
          fi
          echo "Build contents:"
          ls -F dist/
          cat dist/_redirects || true
        env:
          # Set API URL for production build
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=anamnesis-frontend
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
